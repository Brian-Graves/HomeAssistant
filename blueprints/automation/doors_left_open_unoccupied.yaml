blueprint:
  name: Doors Left Open While Area Unoccupied
  description: >
    Triggers when one or more door or cover sensors remain open while all selected
    people are away from home and/or all selected occupancy sensors (such as camera
    zone occupancy or motion sensors) report unoccupied for a configurable duration.
    Exposes {{ open_door_names }} and {{ open_door_entities }} variables for use
    inside notification or TTS actions, plus an optional recovery action block when
    all monitored doors close.
  domain: automation
  input:
    door_sensors:
      name: Door or Cover Sensors
      description: >
        One or more door, garage door, window, or cover entities to monitor for
        being left open.
      selector:
        entity:
          multiple: true
          filter:
            - domain: binary_sensor
              device_class:
                - door
                - garage_door
                - opening
                - window
            - domain: cover
    people_entities:
      name: People Who Must Be Away (Person Entities)
      description: >
        One or more person entities that must all be away ('not_home' / not 'home')
        for the alert to trigger. Leave empty to ignore person presence.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: person
    occupancy_sensors:
      name: Area or Zone Occupancy Sensors (Optional)
      description: >
        Optional occupancy or motion binary sensors (such as camera zone occupancy)
        that must also be 'off' (unoccupied/clear) for the alert to trigger. Leave
        empty to rely solely on the selected Person entities.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: binary_sensor
              device_class:
                - occupancy
                - motion
                - presence
            - domain: binary_sensor
    unoccupied_open_duration:
      name: Open & Away/Unoccupied Duration
      description: >
        How long a door must remain open while all selected people are away (and
        selected occupancy sensors are clear) before triggering the alert actions.
      default:
        hours: 0
        minutes: 5
        seconds: 0
      selector:
        duration:
    alert_actions:
      name: Alert Actions (When Left Open While Away/Unoccupied)
      description: >
        Actions to run when a door is left open while everyone is away and the area
        is unoccupied. You can reference {{ open_door_names }} in message templates.
      default: []
      selector:
        action:
    clear_actions:
      name: Recovery Actions When All Doors Close (Optional)
      description: >
        Optional actions to run once all monitored doors are closed again.
      default: []
      selector:
        action:

mode: restart
max_exceeded: silent

variables:
  doors: !input door_sensors
  people_list: !input people_entities
  occupancy_list: !input occupancy_sensors
  open_door_entities: >
    {{ expand(doors)
       | selectattr('state', 'in', ['on', 'open', 'opening'])
       | map(attribute='entity_id')
       | list }}
  open_door_names: >
    {{ expand(doors)
       | selectattr('state', 'in', ['on', 'open', 'opening'])
       | map(attribute='name')
       | join(', ') }}
  all_people_away: >
    {{ (people_list | count == 0)
       or (expand(people_list) | selectattr('state', 'eq', 'home') | list | count == 0) }}
  area_is_empty: >
    {{ (occupancy_list | count == 0)
       or (expand(occupancy_list) | selectattr('state', 'eq', 'on') | list | count == 0) }}

triggers:
  - trigger: state
    id: door_left_open
    entity_id: !input door_sensors
    to:
      - "on"
      - "open"
    for: !input unoccupied_open_duration
  - trigger: state
    id: person_left_home
    entity_id: !input people_entities
    from: "home"
    for: !input unoccupied_open_duration
  - trigger: state
    id: area_became_empty
    entity_id: !input occupancy_sensors
    to: "off"
    for: !input unoccupied_open_duration
  - trigger: state
    id: door_closed
    entity_id: !input door_sensors
    to:
      - "off"
      - "closed"

conditions: []

actions:
  - choose:
      - conditions:
          - condition: trigger
            id:
              - door_left_open
              - person_left_home
              - area_became_empty
          - condition: template
            value_template: "{{ (open_door_entities | count > 0) and all_people_away and area_is_empty }}"
        sequence: !input alert_actions
      - conditions:
          - condition: trigger
            id: door_closed
          - condition: template
            value_template: "{{ open_door_entities | count == 0 }}"
        sequence: !input clear_actions

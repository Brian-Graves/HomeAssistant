blueprint:
  name: Auto-Unlock Door on Arrival
  description: >
    Automatically unlocks a smart lock when a person or device tracker returns to
    a configurable target zone after being outside that zone for at least a
    configurable minimum away duration. Transitioning between other zones while
    away (such as driving past a store zone near home) never resets the away
    timer, and indoor GPS coordinate updates never falsely trigger the automation.
  domain: automation
  input:
    presence_entity:
      name: Person or Device Tracker
      description: The person or device tracker entity to monitor for departure and arrival.
      selector:
        entity:
          filter:
            - domain:
                - person
                - device_tracker
    target_zone:
      name: Target Arrival Zone
      description: The zone that triggers the unlock upon returning.
      default: zone.home
      selector:
        entity:
          filter:
            - domain: zone
    door_lock:
      name: Door Lock
      description: The smart lock entity to unlock upon arrival.
      selector:
        entity:
          filter:
            - domain: lock
    minimum_away_time:
      name: Minimum Away Duration (Anti-Drift Filter)
      description: >
        Minimum continuous time the person or tracker must be outside the Target
        Arrival Zone before the automation arms for arrival. Prevents brief indoor
        GPS or Wi-Fi drops from unlocking the door while already home, while
        ignoring transitions between other away zones.
      default:
        hours: 0
        minutes: 3
        seconds: 0
      selector:
        duration:
    door_sensor:
      name: Door Contact Sensor (Optional)
      description: >
        Optional door open/close contact sensor. If selected, the automation only
        unlocks when the door is closed. Leave blank to unlock on arrival regardless
        of door sensor state.
      default: ""
      selector:
        entity:
          filter:
            - domain: binary_sensor
              device_class:
                - door
                - opening
                - garage_door
                - window

mode: restart
max_exceeded: silent

trigger_variables:
  tracked_entity: !input presence_entity
  selected_zone: !input target_zone
  target_state: >
    {{ 'home' if selected_zone == 'zone.home' else state_attr(selected_zone, 'friendly_name') }}

variables:
  tracked_entity: !input presence_entity
  selected_zone: !input target_zone
  target_state: >
    {{ 'home' if selected_zone == 'zone.home' else state_attr(selected_zone, 'friendly_name') }}
  selected_door_sensor: !input door_sensor

triggers:
  # Phase 1 (Arm on Departure): Fires once the entity has been continuously outside
  # the Target Arrival Zone (whether 'not_home' or in any other zone) for minimum_away_time.
  - trigger: template
    value_template: >
      {{ states(tracked_entity) not in [target_state, 'unavailable', 'unknown'] }}
    for: !input minimum_away_time

conditions: []

actions:
  # Phase 2 (Wait for Return): Wait until the entity transitions back into the Target Arrival Zone
  - wait_for_trigger:
      - trigger: template
        value_template: "{{ states(tracked_entity) == target_state }}"
    continue_on_timeout: false
  # Verify optional door contact sensor is closed ('off') before unlocking
  - condition: template
    value_template: >
      {{ selected_door_sensor == '' or is_state(selected_door_sensor, 'off') }}
  - action: lock.unlock
    target:
      entity_id: !input door_lock
